backend:
  name: github
  repo: lancoha/Hydrargium
  branch: main
  auth_type: pkce
  client_id: Ov23lizkpzeHMpZts6nW

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: posts
    label: Posts
    folder: posts
    create: true
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Body,  name: body,  widget: markdown }
